name: Release Workflow v2

# Manual while the original tag-triggered release workflow is still enabled.
on:
  workflow_dispatch:
    inputs:
      dry-run:
        description: Build and validate release packages without pushing branches
        type: boolean
        required: true
        default: true

permissions:
  contents: write

concurrency:
  group: release-v2
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout source
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        # Read the version from package.json's packageManager field.

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24.12.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build release packages
        run: |
          set -euo pipefail
          shopt -s nullglob
          filters=()
          : > "$RUNNER_TEMP/release-packages.txt"

          for manifest in packages/*/package.json; do
            # Packages opt in by generating their own release folder.
            if jq -e '.scripts["build:package"] | type == "string"' "$manifest" > /dev/null; then
              package_dir=$(dirname "$manifest")
              filters+=("--filter=./${package_dir}...")
              printf '%s\n' "$package_dir" >> "$RUNNER_TEMP/release-packages.txt"
              rm -rf "$package_dir/build"
            fi
          done

          if [ "${#filters[@]}" -eq 0 ]; then
            echo "No packages define a build:package script."
            exit 1
          fi

          # Bypass the root build script and its legacy ci:output step.
          # Force execution until build/ is included in Turbo's cache outputs.
          pnpm exec turbo run build "${filters[@]}" --force

      - name: Prepare and push release branches
        env:
          DRY_RUN: ${{ inputs.dry-run }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          refs=()

          while IFS= read -r package_dir; do
            output="$GITHUB_WORKSPACE/$package_dir/build"
            manifest="$output/package.json"
            test -f "$manifest"
            test -d "$output/dist"

            name=$(jq -er '.name | select(type == "string" and length > 0)' "$manifest")
            version=$(jq -er '.version | select(type == "string" and length > 0)' "$manifest")
            if [[ ! "$name" =~ ^@konstant/[a-z0-9][a-z0-9._-]*$ ]]; then
              echo "Unsupported release package name: $name"
              exit 1
            fi

            # Release manifests must be usable outside the source workspace.
            if ! jq -e '[.dependencies, .peerDependencies, .optionalDependencies]
              | map(. // {} | to_entries[]) | all(.[];
                (.value | type == "string") and
                (.value | test("^(catalog:|workspace:)") | not))' "$manifest" > /dev/null; then
              echo "Unresolved dependency references in $manifest"
              exit 1
            fi

            branch="v${version}-${name#@konstant/}"
            git check-ref-format "refs/heads/$branch"
            if git ls-remote --exit-code --heads origin "refs/heads/$branch" > /dev/null; then
              if [ "$DRY_RUN" = "true" ]; then
                echo "Dry run: release branch already exists: $branch; continuing without pushing."
                printf 'Existing release branch: `%s`. A real release requires a new version.\n' "$branch" >> "$GITHUB_STEP_SUMMARY"
              else
                echo "Release branch already exists: $branch"
                exit 1
              fi
            else
              status=$?
              # Exit 2 means no matching ref; other errors must stop the release.
              if [ "$status" -ne 2 ]; then exit "$status"; fi
            fi

            worktree=$(mktemp -d "$RUNNER_TEMP/release-v2.XXXXXX")
            git worktree add --detach "$worktree" HEAD
            git -C "$worktree" checkout --orphan "$branch"
            git -C "$worktree" rm -rf --quiet .
            rsync -a --exclude='.git' "$output/" "$worktree/"
            git -C "$worktree" add --all --force
            git -C "$worktree" commit -m "chore: release ${name}@${version}"
            git worktree remove "$worktree"
            refs+=("refs/heads/$branch:refs/heads/$branch")
          done < "$RUNNER_TEMP/release-packages.txt"

          # Publish all prepared branches together, without overwriting releases.
          if [ "$DRY_RUN" = "true" ]; then
            echo "Dry run successful. No release branches were pushed."
            printf 'Prepared: %s\n' "${refs[@]}"
            echo "### Dry run successful" >> "$GITHUB_STEP_SUMMARY"
            echo "Built and validated release packages. No branches were pushed." >> "$GITHUB_STEP_SUMMARY"
          else
            git push --atomic origin "${refs[@]}"
          fi
