name: Release Workflow v2

# Manual while the original tag-triggered release workflow is still enabled.
on:
  workflow_dispatch:
    inputs:
      dry-run:
        description: Build and validate release packages without pushing branches
        type: boolean
        required: true
        default: true

permissions:
  contents: write

concurrency:
  group: release-v2
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout source
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        # Read the version from package.json's packageManager field.

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24.12.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build packages
        run: pnpm build

      - name: Prepare and push release branches
        env:
          DRY_RUN: ${{ inputs.dry-run }}
        run: pnpm exec tsx tools/scripts/release-packages.ts
